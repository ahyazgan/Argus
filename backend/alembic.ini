# Alembic yapilandirmasi (uretim migrasyonlari icin).
# MVP'de tablolar acilista create_all ile olusturulur; Alembic ileride kullanilir:
#   alembic revision --autogenerate -m "init"
#   alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url env.py icinde ortam degiskeninden okunur

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
