[project]
name = "argus-backend"
version = "0.1.0"
description = "Argus Intelligence - OSINT / tehdit istihbarati SaaS backend"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # Veritabani (async: API, sync: Celery worker + Alembic)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Ayarlar / dogrulama
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # Guvenlik
    "passlib[bcrypt]>=1.7.4",
    # bcrypt 4.x passlib 1.7.4 ile uyumsuz (__about__ kaldirildi) -> pinle
    "bcrypt>=3.2,<4.0",
    "pyjwt>=2.10",
    # Gorev kuyrugu
    "celery[redis]>=5.4",
    "redis>=5.2",
    # AI
    "anthropic>=0.40",
    # OSINT / HTTP
    "httpx>=0.28",
    # Cikti (PDF)
    "weasyprint>=63.0",
    "jinja2>=3.1",
    # Odeme
    "stripe>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
